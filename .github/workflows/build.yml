name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Siapkan file APK
        run: cp app/build/outputs/apk/release/app-release.apk Beranda.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Beranda-apk
          path: Beranda.apk

      - name: Terbitkan Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" Beranda.apk \
            --repo "${{ github.repository }}" \
            --title "Beranda $TAG" \
            --notes "Launcher STB ringan. Download Beranda.apk lalu pasang di STB." \
            --latest
